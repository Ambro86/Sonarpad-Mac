name: Test bundled macOS media cutter
on:
  workflow_dispatch:
    inputs:
      check_ui:
        description: Check the native UI (disable only if this source revision already passed)
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  cutter:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            minimum: "11.0"
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            minimum: "10.15"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.minimum }}
      CMAKE_ARGS: -DwxUSE_OPENGL=OFF
      CMAKE_OSX_DEPLOYMENT_TARGET: ${{ matrix.minimum }}
      TEST_RUST_TARGET: ${{ matrix.target }}
      CFLAGS: -mmacosx-version-min=${{ matrix.minimum }}
      CXXFLAGS: -mmacosx-version-min=${{ matrix.minimum }}
      LDFLAGS: -mmacosx-version-min=${{ matrix.minimum }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Check native macOS user interface
        if: ${{ inputs.check_ui }}
        run: cargo check --release --target ${{ matrix.target }}
      - name: Verify cutter keyboard, focus and playback rules
        run: |
          rustc --edition=2024 --test src/media_cutter_keyboard.rs -o /tmp/cutter-keyboard-tests
          /tmp/cutter-keyboard-tests
          python scripts/test_media_cutter_announcements.py
          python scripts/test_media_cutter_focus.py
          python scripts/test_media_cutter_playback.py
      - name: Install test fixture tools
        run: |
          command -v nasm || brew install nasm
          command -v ffmpeg || brew install ffmpeg
          echo "TEST_FIXTURE_FFMPEG=$(command -v ffmpeg)" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: |
            dist/ffmpeg-src
            dist/ffmpeg-install
          key: ${{ runner.os }}-${{ matrix.target }}-ffmpeg-8.0.1-v22-podcast-recording
      - name: Build the exact release FFmpeg configuration
        run: |
          python scripts/test_media_cutter_macos.py --prepare-build
          bash build-test-ffmpeg.sh
      - name: Exercise production cutter export functions
        run: python scripts/test_media_cutter_macos.py dist/ffmpeg-install/bin/ffmpeg
      - name: Exercise production media joining in all output formats
        run: python scripts/test_media_join.py dist/ffmpeg-install/bin/ffmpeg
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: media-cutter-${{ matrix.target }}
          path: |
            media-cutter-test-results/*.log
            media-cutter-test-results/summary.json
          retention-days: 7
