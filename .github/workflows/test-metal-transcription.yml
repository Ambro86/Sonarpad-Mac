name: Test Metal transcription (isolated)
on:
  workflow_dispatch:
  push:
    branches: [test/metal-transcription]
permissions:
  contents: read
jobs:
  metal:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install audio decoding dependencies
        run: python -m pip install av==12.3.0 'numpy>=1.24.2,<2' huggingface_hub
      - name: Build standalone Metal executable
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v1.8.3 https://github.com/ggml-org/whisper.cpp.git metal-source
          test "$(git -C metal-source rev-parse HEAD)" = 2eeeba56e9edd762b4b38467bab96c2517163158
          cmake -S metal-source -B metal-build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.3 -DBUILD_SHARED_LIBS=OFF \
            -DGGML_BACKEND_DL=OFF -DGGML_NATIVE=OFF -DGGML_METAL=ON \
            -DGGML_METAL_EMBED_LIBRARY=ON -DWHISPER_COREML=OFF \
            -DGGML_OPENMP=OFF -DGGML_BLAS=ON -DGGML_BLAS_VENDOR=Apple \
            -DGGML_ACCELERATE=ON -DWHISPER_BUILD_TESTS=OFF
          cmake --build metal-build --target whisper-cli -j 3
          mkdir -p metal-test-results
          cp metal-build/bin/whisper-cli metal-test-results/whisper-cli
          otool -L metal-test-results/whisper-cli > metal-test-results/dependencies.txt
      - name: Transcribe English video and Italian audio using Metal
        run: python scripts/test_metal_transcription.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metal-transcription-results
          path: metal-test-results/
          retention-days: 14
